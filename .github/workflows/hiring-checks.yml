name: Hiring checks
on:
  pull_request:
  push:
    branches: [feat/hiring-page]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm run build
      # Existing tsconfig uses ignoreDeprecations=6.0 with TypeScript 5.x.
      - run: npx tsc --noEmit -p tsconfig.app.json --ignoreDeprecations 5.0
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: docker build -t stele-hiring-check server
